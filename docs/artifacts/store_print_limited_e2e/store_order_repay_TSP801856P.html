<div class="buttons">
    <button type="button" id="ayanas-print-btn">印刷</button>
    <button type="button" id="ayanas-close-btn">閉じる</button>
</div>


<script>
(function () {

    var barcodeValue = "TSP801856P";
    var barcodeType = "CODE39";
    var barcodeDrawOptions = {"barcode_type":"CODE39","format":"CODE39","height":32,"width":1.3,"margin":6,"displayValue":false,"textAlign":"center","background":"#ffffff","lineColor":"#000000"};
    var jsBarcodeUrl = "https://o5nppg7kb4ly.cybozu.com/k/api/plugin/content/download.do?pluginId=pblhdbfbejjlplejiiihlnabolagcfhh&type=DESKTOP_JS&contentId=14066";
    var barcodeJsUrl = "https://o5nppg7kb4ly.cybozu.com/k/api/plugin/content/download.do?pluginId=pblhdbfbejjlplejiiihlnabolagcfhh&type=DESKTOP_JS&contentId=14072";

    function initButtons() {


    function runPrint() {
        var savedTitle = document.title;
        document.title = ' ';
        var restoreTitle = function () {
            document.title = savedTitle;
            window.removeEventListener('afterprint', restoreTitle);
        };
        window.addEventListener('afterprint', restoreTitle);
        window.print();
    }

    document.getElementById('ayanas-print-btn').addEventListener('click', runPrint);

    document.getElementById('ayanas-close-btn').addEventListener('click', function () {
        window.close();
    });
    }

    function drawBarcode() {

        if (typeof window.JsBarcode !== 'function') {
            return;
        }

        if (!window.Barcode || typeof window.Barcode.draw !== 'function') {
            return;
        }

        if (!barcodeValue) {
            initButtons();
            return;
        }

        var svgNodes = document.querySelectorAll('.order-detail-barcode__svg, #barcode');

        if (!svgNodes.length) {
            initButtons();
            return;
        }

        try {
            svgNodes.forEach(function (svg) {
                var nodeValue = svg.getAttribute('data-barcode-value');
                var value = nodeValue && String(nodeValue).trim() !== '' ? nodeValue : barcodeValue;
                if (!value) {
                    return;
                }
                window.Barcode.draw(svg, value, barcodeDrawOptions);
            });
        } catch (error) {
            console.error(error);
            alert('バーコード描画エラー\n\n' + String(error));
        }

    }

    function loadBarcodeJs() {

        var script = document.createElement('script');
        script.src = barcodeJsUrl;
        script.onload = function () {
            drawBarcode();
            initButtons();
        };
        script.onerror = function () {
            console.error('barcode.js の読み込みに失敗しました。', barcodeJsUrl);
            initButtons();
        };
        document.head.appendChild(script);

    }

    function loadJsBarcode() {

        var script = document.createElement('script');
        script.src = jsBarcodeUrl;
        script.onload = function () {
            loadBarcodeJs();
        };
        script.onerror = function () {
            console.error('JsBarcode.all.min.js の読み込みに失敗しました。', jsBarcodeUrl);
            initButtons();
        };
        document.head.appendChild(script);

    }

    loadJsBarcode();

})();
</script>
</body>
