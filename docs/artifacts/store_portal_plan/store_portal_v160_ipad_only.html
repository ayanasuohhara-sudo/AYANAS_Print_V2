<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店舗ポータル iPad</title>
  <link rel="stylesheet" href="../../../customize/floor_portal.css" />
  <style>body{margin:0;background:#94a3b8}</style>
</head>
<body>
  <div class="cayan-fp-root cayan-fp-root--store" data-mode="store">
    <header class="cayan-fp-header">
      <div class="cayan-fp-header__main">
        <div class="cayan-fp-title-row">
          <span class="cayan-fp-mode-badge">店舗 A550</span>
          <h1 class="cayan-fp-title">店舗ポータル（A550）</h1>
        </div>
      </div>
      <div class="cayan-fp-header__side"><button type="button" class="cayan-fp-btn">更新</button></div>
    </header>
    <section class="cayan-fp-menu">
      <h2 class="cayan-fp-menu__title">店舗メニュー（A550）</h2>
      <p class="cayan-fp-note cayan-fp-note--warn">権限のないユーザーには操作できません（表示だけでは権限は付きません）。</p>
      <div class="cayan-fp-menu__groups">
        <div class="cayan-fp-menu-group">
          <h3 class="cayan-fp-menu-group__title">受付・顧客</h3>
          <div class="cayan-fp-menu-group__links">
            <a class="cayan-fp-btn cayan-fp-btn--menu is-featured" href="#"><span class="cayan-fp-menu__label">受注登録</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu is-featured" href="#"><span class="cayan-fp-menu__label">受注検索</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu" href="#"><span class="cayan-fp-menu__label">個人顧客管理</span></a>
          </div>
        </div>
        <div class="cayan-fp-menu-group">
          <h3 class="cayan-fp-menu-group__title">作業・移動</h3>
          <div class="cayan-fp-menu-group__links">
            <a class="cayan-fp-btn cayan-fp-btn--menu" href="#"><span class="cayan-fp-menu__label">保管場所移動</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu" href="#"><span class="cayan-fp-menu__label">社内作業登録</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu" href="#"><span class="cayan-fp-menu__label">仕上げ完了</span></a>
          </div>
        </div>
        <div class="cayan-fp-menu-group">
          <h3 class="cayan-fp-menu-group__title">納品・会計</h3>
          <div class="cayan-fp-menu-group__links">
            <a class="cayan-fp-btn cayan-fp-btn--menu is-featured" href="#"><span class="cayan-fp-menu__label">納期・引き取り待ち管理</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu is-featured" href="#"><span class="cayan-fp-menu__label">入金登録</span></a>
            <a class="cayan-fp-btn cayan-fp-btn--menu" href="#"><span class="cayan-fp-menu__label">納品書作成</span></a>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
